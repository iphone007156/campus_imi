name: campus_imi
description: СВФУ Campus App for students

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  image_picker: ^1.2.3
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_storage: ^12.4.10
  cloud_firestore: 5.6.12
  flutter_svg: ^2.0.10
  xml: ^6.5.0
  path_drawing: ^1.0.1
  file_picker: ^10.0.0
  url_launcher: ^6.3.0
  excel: ^4.0.6
  crypto: ^3.0.3
  supabase_flutter: ^2.16.0
  onesignal_flutter: ^5.2.9
  timezone: ^0.10.1
  flutter_local_notifications: ^19.0.0
  flutter_timezone: ^4.1.0
  http: ^1.2.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/maps/