# Умеренные настройки памяти — достаточно для большинства проектов.
# 4G хватает с запасом, не нагружая систему.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true

# ✅ Включаем параллельную сборку (ускоряет компиляцию)
org.gradle.parallel=true

# ✅ Включаем кэширование (повторные сборки будут быстрее)
org.gradle.caching=true

# ✅ Разрешаем Gradle использовать демон (он держит кэш в памяти между сборками)
org.gradle.daemon=true

# Флаги из шаблона Flutter (не трогаем, они нужны для совместимости)
android.newDsl=false
android.builtInKotlin=false